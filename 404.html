<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | NiyuktiPoints</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .box {
      max-width: 440px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 32px;
      text-align: left;
    }
    .code {
      font-family: monospace;
      font-size: 0.85rem;
      color: #0284c7;
      font-weight: 700;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1.4rem;
      margin: 0 0 10px;
    }
    p {
      color: #475569;
      font-size: 0.925rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    a {
      display: inline-block;
      background: #0284c7;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="box">
    <div class="code">HTTP ERROR 404</div>
    <h1>Requested page was not found</h1>
    <p>The study resource or notice link you followed may have been moved or updated. Return to the main NiyuktiPoints portal to browse verified BTEUP materials.</p>
